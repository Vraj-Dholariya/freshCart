<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — freshcart</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>

  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-paper tw-page">

  <div id="site-header"></div>

  <!-- ============ TAILWIND COMPONENT: Sign In Card ============ -->
  <main class="px-4 pb-20 pt-10 sm:pt-14">

    <div class="mx-auto max-w-md text-center">
      <h1 class="font-display text-4xl font-bold text-forest sm:text-5xl">Welcome Back</h1>
      <p class="mt-3 text-slate-500">Sign in to manage your cart, track deliveries, and save farm favorites.</p>
    </div>

    <div class="mx-auto mt-8 max-w-md">
      <!-- Quick Demo Login Banner -->
      <div class="mb-6 rounded-2xl border border-amber-200 bg-amber-50/80 p-4 shadow-sm">
        <div class="flex items-center justify-between">
          <span class="font-mono text-xs font-semibold uppercase tracking-wider text-amber-800">⚡ Demo Quick Fill</span>
          <span class="text-xs text-amber-600">Click to auto-fill</span>
        </div>
        <div class="mt-3 flex gap-2">
          <button type="button" id="btn-demo-user"
            class="flex-1 rounded-xl bg-white px-3 py-2 font-body text-xs font-medium text-forest border border-amber-200 hover:bg-amber-100/50 transition">
            👤 Customer Demo
          </button>
          <button type="button" id="btn-demo-grower"
            class="flex-1 rounded-xl bg-white px-3 py-2 font-body text-xs font-medium text-forest border border-amber-200 hover:bg-amber-100/50 transition">
            🌾 Grower Demo
          </button>
        </div>
      </div>

      <!-- Main Form Card -->
      <div
        class="overflow-hidden rounded-3xl bg-gradient-to-br from-emerald-50/60 to-amber-50/60 p-[1px] shadow-xl shadow-forest/5">
        <div class="rounded-[calc(1.5rem-1px)] bg-white/90 px-6 py-7 backdrop-blur-sm sm:px-8">

          <!-- User Logged In View (shown if session exists) -->
          <div id="logged-in-view" class="hidden text-center py-4">
            <div
              class="mx-auto mb-3 flex h-16 w-16 items-center justify-center rounded-full bg-emerald-100 text-2xl text-emerald-800">
              👤
            </div>
            <h2 id="user-display-name" class="font-display text-2xl font-bold text-forest">User</h2>
            <p id="user-display-email" class="font-mono text-xs text-slate-500 mt-1">user@email.com</p>
            <span id="user-display-role"
              class="mt-3 inline-block rounded-full bg-emerald-50 px-3 py-1 font-mono text-xs font-medium text-emerald-700">Customer
              Account</span>

            <div class="mt-8 flex flex-col gap-2">
              <a href="cart.html"
                class="w-full rounded-xl bg-forest py-2.5 font-body text-sm font-medium text-paper text-center hover:bg-forest/90 transition">
                Go to cart
              </a>
              <button type="button" id="btn-signout"
                class="w-full rounded-xl border border-red-200 bg-red-50/50 py-2.5 font-body text-sm font-medium text-red-600 hover:bg-red-100/50 transition">
                Sign Out
              </button>
            </div>
          </div>

          <!-- Auth Form View (shown when guest) -->
          <div id="auth-form-view">
            <!-- Mode Switch Tabs -->
            <div class="flex rounded-xl bg-slate-100 p-1 mb-6">
              <button type="button" id="tab-signin"
                class="flex-1 rounded-lg py-2 font-body text-xs font-semibold transition text-forest bg-white shadow-sm">
                Sign In
              </button>
              <button type="button" id="tab-signup"
                class="flex-1 rounded-lg py-2 font-body text-xs font-semibold transition text-slate-500 hover:text-forest">
                Create Account
              </button>
            </div>

            <!-- Feedback Alert Message -->
            <div id="alert-box" class="hidden mb-4 rounded-xl p-3 text-xs font-body transition"></div>

            <!-- Sign In Form -->
            <form id="form-signin" class="space-y-4">
              <div>
                <label for="signin-email" class="block font-mono text-xs font-medium text-slate-600 mb-1">Email
                  address</label>
                <input type="email" id="signin-email" placeholder="you@example.com" required autocomplete="email"
                  class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 font-mono text-sm text-slate-700 placeholder:text-slate-400 focus:border-leaf focus:outline-none focus:ring-2 focus:ring-leaf/20">
              </div>

              <div>
                <div class="flex justify-between items-center mb-1">
                  <label for="signin-password" class="font-mono text-xs font-medium text-slate-600">Password</label>
                  <button type="button" id="toggle-signin-password"
                    class="font-mono text-[11px] text-leaf hover:underline">Show</button>
                </div>
                <input type="password" id="signin-password" placeholder="••••••••" required
                  autocomplete="current-password"
                  class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 font-mono text-sm text-slate-700 placeholder:text-slate-400 focus:border-leaf focus:outline-none focus:ring-2 focus:ring-leaf/20">
              </div>

              <div class="flex items-center justify-between pt-1">
                <label class="flex items-center gap-2 cursor-pointer select-none">
                  <input type="checkbox" id="remember-me" checked
                    class="rounded border-slate-300 text-forest focus:ring-leaf">
                  <span class="font-body text-xs text-slate-600">Remember me</span>
                </label>
                <a href="#" id="link-forgot" class="font-mono text-xs text-leaf hover:underline">Forgot password?</a>
              </div>

              <button type="submit" id="btn-submit-signin"
                class="w-full rounded-xl bg-forest py-3 font-body text-sm font-medium text-paper transition-all hover:bg-forest/90 active:scale-[0.99] flex items-center justify-center gap-2">
                <span>Sign In</span>
              </button>
            </form>

            <!-- Sign Up Form (hidden by default) -->
            <form id="form-signup" class="space-y-4 hidden">
              <div>
                <label for="signup-name" class="block font-mono text-xs font-medium text-slate-600 mb-1">Full
                  Name</label>
                <input type="text" id="signup-name" placeholder="Jane Doe" required autocomplete="name"
                  class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 font-mono text-sm text-slate-700 placeholder:text-slate-400 focus:border-leaf focus:outline-none focus:ring-2 focus:ring-leaf/20">
              </div>

              <div>
                <label for="signup-email" class="block font-mono text-xs font-medium text-slate-600 mb-1">Email
                  address</label>
                <input type="email" id="signup-email" placeholder="you@example.com" required autocomplete="email"
                  class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 font-mono text-sm text-slate-700 placeholder:text-slate-400 focus:border-leaf focus:outline-none focus:ring-2 focus:ring-leaf/20">
              </div>

              <div>
                <div class="flex justify-between items-center mb-1">
                  <label for="signup-password" class="font-mono text-xs font-medium text-slate-600">Password</label>
                  <button type="button" id="toggle-signup-password"
                    class="font-mono text-[11px] text-leaf hover:underline">Show</button>
                </div>
                <input type="password" id="signup-password" placeholder="At least 6 characters" minlength="6" required
                  autocomplete="new-password"
                  class="w-full rounded-xl border border-slate-200 px-3.5 py-2.5 font-mono text-sm text-slate-700 placeholder:text-slate-400 focus:border-leaf focus:outline-none focus:ring-2 focus:ring-leaf/20">
              </div>

              <button type="submit" id="btn-submit-signup"
                class="w-full rounded-xl bg-forest py-3 font-body text-sm font-medium text-paper transition-all hover:bg-forest/90 active:scale-[0.99] flex items-center justify-center gap-2">
                <span>Create Account</span>
              </button>
            </form>
          </div>

        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/store.js"></script>
  <script src="js/signin.js"></script>
</body>

</html>
